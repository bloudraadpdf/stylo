derive_value_info = false
rule_types_allowed = ["style", "keyframe", "page", "scope", "position-try"]

[overflow]
sub_properties = ["overflow-x", "overflow-y"]
spec="https://drafts.csswg.org/css-overflow/#propdef-overflow"
kind = "two_properties"
rule_types_allowed = ["style", "keyframe", "page", "scope", "position-try"]

# CSS Overflow 4 §5.1 — standard block-container line clamp. Keeping
# `line-clamp` exclusively in the shorthand table makes it impossible for
# computed style to contain an independent clamp value that disagrees with
# its three longhands.
[line-clamp]
sub_properties = ["max-lines", "continue", "block-ellipsis"]
spec = "https://www.w3.org/TR/css-overflow-4/#propdef-line-clamp"
derive_value_info = false

# CSS Overflow 4 §3.4 — `overflow-clip-margin` shorthand. Spec syntax
# `<visual-box> || <length [0,∞]>{1,4}`: an optional reference-box
# keyword that applies uniformly across all four sides, plus 1–4
# length values distributed per the standard 4-side pattern
# (1 -> all; 2 -> v/h; 3 -> top/h/bottom; 4 -> top/right/bottom/left).
# Custom expander lives in shorthands.rs.
[overflow-clip-margin]
sub_properties = ["overflow-clip-margin-top", "overflow-clip-margin-right", "overflow-clip-margin-bottom", "overflow-clip-margin-left"]
spec = "https://drafts.csswg.org/css-overflow-4/#overflow-clip-margin-shorthand"

# CSS Overflow 4 §3.4 — `overflow-clip-margin-block` shorthand. Spec
# syntax `<visual-box> || <length [0,∞]>{1,2}`. One length applies to
# both block-start and block-end; two lengths set start / end. The
# optional reference-box keyword is shared across both sides.
[overflow-clip-margin-block]
sub_properties = ["overflow-clip-margin-block-start", "overflow-clip-margin-block-end"]
spec = "https://drafts.csswg.org/css-overflow-4/#overflow-clip-margin-block"

# CSS Overflow 4 §3.4 — `overflow-clip-margin-inline` shorthand. Spec
# syntax `<visual-box> || <length [0,∞]>{1,2}`. One length applies to
# both inline-start and inline-end; two lengths set start / end. The
# optional reference-box keyword is shared across both sides.
[overflow-clip-margin-inline]
sub_properties = ["overflow-clip-margin-inline-start", "overflow-clip-margin-inline-end"]
spec = "https://drafts.csswg.org/css-overflow-4/#overflow-clip-margin-inline"

[overscroll-behavior]
engine = "gecko"
sub_properties = ["overscroll-behavior-x", "overscroll-behavior-y"]
spec = "https://wicg.github.io/overscroll-behavior/#overscroll-behavior-properties"
kind = "two_properties"

[container]
engine = "gecko"
sub_properties = ["container-name", "container-type"]
spec = "https://drafts.csswg.org/css-contain-3/#container-shorthand"

[vertical-align]
sub_properties = ["alignment-baseline", "baseline-shift", "baseline-source"]
spec = "https://drafts.csswg.org/css-inline-3/#transverse-alignment"
rule_types_allowed = ["style", "keyframe", "page", "scope", "position-try"]

[page-break-before]
flags = "IS_LEGACY_SHORTHAND"
sub_properties = ["break-before"]
spec = "https://drafts.csswg.org/css-break-3/#page-break-properties"

[page-break-after]
flags = "IS_LEGACY_SHORTHAND"
sub_properties = ["break-after"]
spec = "https://drafts.csswg.org/css-break-3/#page-break-properties"

[page-break-inside]
flags = "IS_LEGACY_SHORTHAND"
sub_properties = ["break-inside"]
spec = "https://drafts.csswg.org/css-break-3/#page-break-properties"

# CSS Text 4 §8.1 — `text-align` is a shorthand for `text-align-all`
# and `text-align-last`.
#   Value: <text-align-all> || <text-align-last>
# When given a single value, set text-align-all to that value and reset
# text-align-last to `auto`. When given two values, the first sets
# text-align-all and the second sets text-align-last.
[text-align]
sub_properties = ["text-align-all", "text-align-last"]
spec = "https://drafts.csswg.org/css-text-4/#text-align-property"
rule_types_allowed = ["style", "keyframe", "page", "scope", "position-try"]

[text-box]
sub_properties = ["leading-trim", "text-box-edge"]
spec = "https://drafts.csswg.org/css-inline-3/#text-box-shorthand"
rule_types_allowed = ["style", "keyframe", "page", "scope", "position-try"]

[offset]
engine = "gecko"
sub_properties = ["offset-path", "offset-distance", "offset-rotate", "offset-anchor", "offset-position"]
spec = "https://drafts.fxtf.org/motion-1/#offset-shorthand"

[-webkit-perspective]
sub_properties = ["perspective"]
derive_serialize = true
flags = "IS_LEGACY_SHORTHAND"
spec = "https://github.com/whatwg/compat/issues/100"

[-webkit-transform]
sub_properties = ["transform"]
derive_serialize = true
flags = "IS_LEGACY_SHORTHAND"
spec = "https://github.com/whatwg/compat/issues/100"

[background]
sub_properties = [
  "background-color",
  "background-position-x",
  "background-position-y",
  "background-repeat",
  "background-attachment",
  "background-image",
  "background-size",
  "background-origin",
  "background-clip"
]

# CSS Backgrounds 4 §5.5 — `corner-shape` shorthand sets all four
# per-corner shape longhands at once. Grammar mirrors `border-radius`
# (1, 2, 3, or 4 values applying TL TR BR BL with the canonical tile).
[corner-shape]
sub_properties = ["corner-top-left-shape", "corner-top-right-shape", "corner-bottom-right-shape", "corner-bottom-left-shape"]
spec = "https://drafts.csswg.org/css-backgrounds-4/#corner-shape"

# CSS Borders 4 §3.4 — `corner` pairs each physical corner's radius and
# shape. Slash separators select the TL, TR, BR, BL corners in order.
[corner]
sub_properties = [
  "border-top-left-radius",
  "border-top-right-radius",
  "border-bottom-right-radius",
  "border-bottom-left-radius",
  "corner-top-left-shape",
  "corner-top-right-shape",
  "corner-bottom-right-shape",
  "corner-bottom-left-shape",
]
spec = "https://drafts.csswg.org/css-borders-4/#corner-shorthand"

[outline]
sub_properties = ["outline-color", "outline-style", "outline-width"]
rule_types_allowed = ["style", "keyframe", "page", "scope", "position-try"]
spec = "https://drafts.csswg.org/css-ui/#propdef-outline"

[columns]
sub_properties = ["column-width", "column-count"]
spec = "https://drafts.csswg.org/css-multicol/#propdef-columns"
servo_pref = "layout.columns.enabled"

[column-rule]
servo_pref = "layout.columns.enabled"
sub_properties = ["column-rule-width", "column-rule-style", "column-rule-color"]
spec = "https://drafts.csswg.org/css-multicol/#propdef-column-rule"
derive_serialize = true

[text-decoration]
sub_properties = ["text-decoration-color", "text-decoration-line", "text-decoration-style", "text-decoration-thickness"]
spec = "https://drafts.csswg.org/css-text-decor/#propdef-text-decoration"

# CSS Text Decoration 4 §5 — informational shorthand for the four
# `text-decoration-skip-*` longhands. The shorthand grammar is
# intentionally permissive: any subset of the four longhand values may
# be authored, and any absent longhand is reset to its per-aspect
# initial. The hand-rolled parser in `shorthands.rs` reuses the
# `TextDecorationSkipKind` Parse impl per slot.
[text-decoration-skip]
sub_properties = [
  "text-decoration-skip-self",
  "text-decoration-skip-box",
  "text-decoration-skip-inset",
  "text-decoration-skip-spaces",
]
spec = "https://drafts.csswg.org/css-text-decor-4/#text-decoration-skip-property"
derive_serialize = true

[-bd-text-overline]
sub_properties = ["-bd-text-overline-color", "-bd-text-overline-style", "-bd-text-overline-thickness"]
spec = "Nonstandard (moegoe -bd-* fork extension; Prince G text-overline shorthand)"
derive_serialize = true

[-bd-text-underline]
sub_properties = ["-bd-text-underline-color", "-bd-text-underline-style", "-bd-text-underline-thickness"]
spec = "Nonstandard (moegoe -bd-* fork extension; Prince G text-underline shorthand)"
derive_serialize = true

[-bd-text-linethrough]
sub_properties = ["-bd-text-linethrough-color", "-bd-text-linethrough-style", "-bd-text-linethrough-thickness"]
spec = "Nonstandard (moegoe -bd-* fork extension; Prince G text-line-through shorthand)"
derive_serialize = true

# moegoe F16 — `-bd-change-bar` shorthand mirroring PDFreactor's
# `-ro-change-bar` (`docs/reference-manuals/pdfreactor.md:13805`):
# `<colour> | <align> | <offset> | <width> [/<name>]`. Components
# are order-independent (per the WD); the `/<name>` segment is
# optional and only matches an ident *after* a literal `/`.
[-bd-change-bar]
sub_properties = ["-bd-change-bar-colour", "-bd-change-bar-align", "-bd-change-bar-offset", "-bd-change-bar-width", "-bd-change-bar-name"]
spec = "Nonstandard (moegoe -bd-* fork extension; Family 16 change-bar shorthand)"
derive_serialize = true

[font]
sub_properties = [
  "font-style",
  "font-variant-caps",
  "font-weight",
  "font-stretch",
  "font-size",
  "line-height",
  "font-family",
  "font-optical-sizing",
  "font-variation-settings",
  "font-size-adjust",
  "font-kerning",
  "font-variant-alternates",
  "font-variant-east-asian",
  "font-variant-emoji",
  "font-variant-ligatures",
  "font-variant-numeric",
  "font-variant-position",
  "font-feature-settings"
]
extra_gecko_sub_properties = [
  "font-language-override"
]
spec = "https://drafts.csswg.org/css-fonts-3/#propdef-font"
derive_value_info = false
# CSS Page 3 Appendix A lists the font properties among those that apply in
# the page context, and every `font` sub-property this shorthand sets already
# carries `page`. Without it the shorthand is rejected whole, so
# `@bottom-left { font: 7pt sans-serif }` -- the spelling PDFreactor's own
# sample stylesheets use -- silently falls back to the initial 12pt serif.
# `margin` is not listed because a margin rule nests inside `@page` and the
# parser accumulates both rule types (see `line-height`, `font-size`).
rule_types_allowed = ["style", "keyframe", "page", "scope"]

[font-variant]
sub_properties = ["font-variant-caps", "font-variant-alternates", "font-variant-east-asian", "font-variant-emoji", "font-variant-ligatures", "font-variant-numeric", "font-variant-position"]
spec = "https://drafts.csswg.org/css-fonts-3/#propdef-font-variant"

[font-synthesis]
sub_properties = ["font-synthesis-weight", "font-synthesis-style", "font-synthesis-small-caps", "font-synthesis-position"]
spec = "https://drafts.csswg.org/css-fonts-3/#propdef-font-variant"
derive_value_info = false

[text-emphasis]
sub_properties = ["text-emphasis-style", "text-emphasis-color"]
spec = "https://drafts.csswg.org/css-text-decor-3/#text-emphasis-property"
derive_serialize = true

[text-wrap]
sub_properties = ["text-wrap-mode", "text-wrap-style"]
spec = "https://www.w3.org/TR/css-text-4/#text-wrap"

[white-space]
sub_properties = ["text-wrap-mode", "white-space-collapse"]
spec = "https://www.w3.org/TR/css-text-4/#white-space-property"
derive_value_info = false

[-webkit-text-stroke]
engine = "gecko"
sub_properties = ["-webkit-text-stroke-width", "-webkit-text-stroke-color"]
spec = "https://compat.spec.whatwg.org/#the-webkit-text-stroke"
derive_serialize = true

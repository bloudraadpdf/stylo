# CSS Backgrounds 4 §5.5 — `corner-shape` per-corner longhands. Each
# longhand pairs with the matching `border-*-radius` slot and selects
# the geometric profile of that corner (round | bevel | scoop | notch
# | square | superellipse(<number>)). Initial value `round` reproduces
# the existing CSS Backgrounds 3 quarter-ellipse behaviour.
#
# CSS Backgrounds 4 §5.5 (2025-09-25 ED) does not (yet) define
# logical corner-shape longhands (`corner-start-start-shape` etc.) —
# only the four physical corners. They therefore do NOT share a
# Stylo logical_group; Stylo's group-balance invariant requires every
# logical_group to have a 1:1 physical/logical pairing (see
# `properties/data.py::PropertiesData.__init__`), which would
# otherwise fail at build time. Add `logical_group = "corner-shape"`
# back when the spec adds the logical longhand quartet.

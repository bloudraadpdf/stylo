# CSS Line Grid Module Level 1 §3 — standard `line-grid` property.
# The moegoe-native `-bd-line-grid` longhand above carries a superset
# (`none | match-parent | create`); the standard variant tracked here
# is the spec-aligned two-keyword grammar `match-parent | create` so
# authored content using the W3C-spec property name parses correctly.
[line-grid]
type = "LineGrid"
initial = "computed::LineGrid::MatchParent"
struct = "box"
initial_specified_value = "specified::LineGrid::MatchParent"
spec = "https://drafts.csswg.org/css-line-grid-1/#line-grid"
animation_type = "none"
affects = "layout"

# CSS Line Grid Module Level 1 §6.1 — `line-snap` controls how line
# boxes inside a block container snap to its line grid. The moegoe
# fork's `-bd-line-snap` longhand above shares the same three-keyword
# grammar; both surfaces project onto the same downstream IR variant
# so the layout pass only consumes one signal.
[line-snap]

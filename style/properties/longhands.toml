# CSS Display Module Level 4 §3 — sequential-navigation order. Both
# properties are non-inherited per the spec: `reading-flow` applies to
# the flex/grid container that opts in, and `reading-order` is set on
# individual items that participate in the container's reading flow.
# They share the non-inherited `position` struct alongside `order`.
[reading-flow]
type = "ReadingFlow"
initial = "computed::ReadingFlow::Normal"
struct = "position"
initial_specified_value = "specified::ReadingFlow::Normal"
spec = "https://drafts.csswg.org/css-display-4/#reading-flow"
animation_type = "discrete"
